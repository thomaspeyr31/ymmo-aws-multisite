# Contrôleur Ansible — exécution LOCALE (macOS) stabilisée, sans Docker.
#
# Pré-requis macOS (à exporter une fois dans le shell, sinon "worker in a dead state") :
#   export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
#   export no_proxy='*'
# (problèmes connus de fork() macOS avec boto3/objc ; inoffensifs ailleurs)
[defaults]
inventory = inventory/aws_ec2.yml
host_key_checking = False
collections_path = ./collections
# callback "default" : le callback "yaml" crashe le worker forké sur macOS.
stdout_callback = default
forks = 1
# laisse le temps aux modules longs (promotion DC) de répondre via SSM
timeout = 120

[inventory]
enable_plugins = amazon.aws.aws_ec2
