---
# Crée la MATRICE DES DROITS sur le serveur de fichiers : un partage SMB par groupe
# FONCTION (vars/ad.yml), ACL NTFS = GRP_<Pôle> → un utilisateur n'accède qu'au partage
# de son pôle (accès refusé ailleurs). Modèle simple « un espace partagé par groupe ».
# PowerShell exécuté PAR Ansible (un seul batch, idempotent). Pas de credential : la
# connexion SSM tourne en admin local, suffisant pour les partages/ACL locaux.
#
# Lancement : ansible-playbook -i inventory/aws_ec2.yml playbooks/fileserver-shares.yml
- name: Serveur de fichiers Ymmo — partages SMB + ACL NTFS par groupe
  hosts: fileserver
  gather_facts: false
  vars_files:
    - ../vars/ad.yml
  tasks:
    - name: Créer les dossiers, partages et ACL (un par groupe fonction)
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Netbios = '{{ netbios }}'
          $Groups  = '{{ groupes_fonction | to_json }}' | ConvertFrom-Json
          $base = 'C:\Partages'
          New-Item -ItemType Directory -Path $base -Force | Out-Null
          $log = @()
          $full = [System.Security.AccessControl.FileSystemRights]::FullControl
          $mod  = [System.Security.AccessControl.FileSystemRights]::Modify
          $inh  = 'ContainerInherit,ObjectInherit'
          # Nom localisé des "Utilisateurs authentifiés" (S-1-5-11) pour le partage SMB
          $authUsers = (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-11')).Translate([System.Security.Principal.NTAccount]).Value

          foreach ($g in $Groups) {
            $share = $g -replace '^GRP_',''          # GRP_Commercial -> Commercial
            $path  = Join-Path $base $share
            New-Item -ItemType Directory -Path $path -Force | Out-Null

            # Résoudre le groupe de domaine en SID (un SID se lie toujours dans une ACL)
            $sid = (New-Object System.Security.Principal.NTAccount($Netbios, $g)).Translate([System.Security.Principal.SecurityIdentifier])

            # --- ACL NTFS : couper l'héritage, ne laisser QUE Admins/SYSTEM + le groupe ---
            $acl = Get-Acl $path
            $acl.SetAccessRuleProtection($true, $false)
            $acl.Access | ForEach-Object { [void]$acl.RemoveAccessRule($_) }
            # SID bien connus (robuste à la localisation FR) : Administrateurs local + SYSTEM
            foreach ($wk in @('S-1-5-32-544','S-1-5-18')) {
              $id = New-Object System.Security.Principal.SecurityIdentifier($wk)
              $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($id,$full,$inh,'None','Allow')))
            }
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($sid,$mod,$inh,'None','Allow')))
            Set-Acl -Path $path -AclObject $acl

            # --- Partage SMB : ouvert au niveau partage, filtré par le NTFS ---
            if (-not (Get-SmbShare -Name $share -EA SilentlyContinue)) {
              New-SmbShare -Name $share -Path $path -FullAccess $authUsers | Out-Null
              $log += "SHARE+ $share ($($sid.Value))"
            } else { $log += "SHARE= $share" }
          }
          $Ansible.Changed = $true
          "Partages: " + ((Get-SmbShare | Where-Object { $_.Path -like 'C:\Partages\*' } | Select-Object -Expand Name) -join ', ')
          "Detail: " + ($log -join ', ')
      register: shares

    - name: Bilan
      ansible.builtin.debug:
        var: shares.output
