  - { login: "thomas.petit",  prenom: "Thomas", nom: "Petit",  titre: "Responsable marketing",      groupe_fonction: "GRP_CommMktg",   site: "siege" }
  - { login: "nadia.hamon",   prenom: "Nadia",  nom: "Hamon",  titre: "Responsable RH",             groupe_fonction: "GRP_AdminRH",    site: "siege" }
